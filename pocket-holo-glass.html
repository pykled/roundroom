<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #030306; padding: 48px; font-family: -apple-system, sans-serif; }
.section-label { font-size: 10px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: #4a4a6a; margin-bottom: 16px; }
.grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; max-width: 900px; margin-bottom: 48px; }
.card { background: #09090f; border: 1px solid #0e0e18; border-radius: 20px; padding: 24px; text-align: center; }
.card img { width: 220px; height: 220px; object-fit: contain; border-radius: 12px; }
.label { font-size: 9px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #222232; margin-top: 12px; }
</style></head>
<body>
<div class="section-label">Holographic Foil</div>
<div class="grid">
  <div class="card"><img src="holo_a.png"><div class="label">Iridescent Purple-Blue</div></div>
  <div class="card"><img src="holo_b.png"><div class="label">Oil-Slick Landscape</div></div>
  <div class="card"><img src="holo_c.png"><div class="label">Starburst Foil</div></div>
</div>
<div class="section-label">Glass Card</div>
<div class="grid">
  <div class="card"><img src="glass_a.png"><div class="label">Smoked Glass, Glows Inside</div></div>
  <div class="card"><img src="glass_b.png"><div class="label">Frosted Glass</div></div>
  <div class="card"><img src="glass_c.png"><div class="label">Layered Glass — 3D Depth</div></div>
</div>
</body></html>
