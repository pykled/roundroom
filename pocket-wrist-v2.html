<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #030306; padding: 48px; font-family: -apple-system, sans-serif; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 900px; }
.card { background: #09090f; border: 1px solid #0e0e18; border-radius: 20px; padding: 32px; text-align: center; }
.card img { width: 300px; height: 300px; object-fit: contain; border-radius: 16px; }
.label { font-size: 9px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #222232; margin-top: 16px; }
</style></head>
<body>
<div class="grid">
  <div class="card"><img src="wv_1.png"><div class="label">Classic Formation</div></div>
  <div class="card"><img src="wv_2.png"><div class="label">Angled Perspective</div></div>
  <div class="card"><img src="wv_3.png"><div class="label">Square + Neon Arc</div></div>
  <div class="card"><img src="wv_4.png"><div class="label">Circuit Board Formation</div></div>
</div>
</body></html>
