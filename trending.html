<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trending Players — Movers | Pocket</title>
<meta name="description" content="See which NFL players are trending up or down this week — usage spikes, add/drop momentum, and form signals for your fantasy roster.">
<link rel="canonical" href="https://pocketff.com/trending">
<meta name="theme-color" content="#6366f1">
<meta property="og:site_name" content="Pocket">
<meta property="og:title" content="Trending Players — Movers | Pocket">
<meta property="og:description" content="Usage spikes, add/drop momentum, and form signals — who to pick up before the rest of your league figures it out.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://pocketff.com/trending">
<meta property="og:image" content="https://pocketff.com/og.png">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/shared/styles.css">
<script defer src="/shared/nav.js"></script>
<style>
#app { max-width: 900px; width: 100%; }

/* Position pill filter */
.pos-filter { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: var(--space-4); }
.pos-pill {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  padding: 0.3rem 0.75rem;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.pos-pill:hover { border-color: var(--border-bright); color: var(--text-primary); }
.pos-pill.active { background: #6366f1; border-color: #6366f1; color: #fff; }
.pos-pill.RB.active  { background: var(--rb);  border-color: var(--rb);  }
.pos-pill.WR.active  { background: var(--wr);  border-color: var(--wr);  }
.pos-pill.TE.active  { background: var(--te);  border-color: var(--te);  }
.pos-pill.QB.active  { background: var(--qb);  border-color: var(--qb);  }

/* Two-column layout on desktop */
.movers-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-4);
  align-items: start;
}
@media (max-width: 640px) {
  .movers-grid { grid-template-columns: 1fr; }
}

.movers-col { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-4); }
.movers-col-hdr {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  margin-bottom: var(--space-3);
  padding-bottom: var(--space-2);
  border-bottom: 1px solid var(--border);
}
.movers-col-hdr.up   { color: var(--success); }
.movers-col-hdr.down { color: var(--danger); }

/* Player row */
.mv-row {
  display: flex;
  align-items: flex-start;
  gap: 0.6rem;
  padding: 0.5rem 0.25rem;
  border-bottom: 1px solid var(--border);
}
.mv-row:last-child { border-bottom: none; }

/* Trend bar */
.mv-bar-wrap { width: 44px; flex-shrink: 0; display: flex; align-items: center; padding-top: 0.3rem; }
.mv-bar-bg {
  width: 100%;
  height: 4px;
  border-radius: 2px;
  background: var(--bg-elevated, rgba(255,255,255,0.05));
  overflow: hidden;
}
.mv-bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.3s ease;
}
.up   .mv-bar-fill { background: var(--success); }
.down .mv-bar-fill { background: var(--danger); }

/* Headshot */
.mv-hs {
  width: 34px; height: 34px;
  border-radius: 50%;
  object-fit: cover;
  object-position: top;
  flex-shrink: 0;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
}

/* Player info */
.mv-info { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 0.15rem; }
.mv-name-row { display: flex; align-items: center; gap: 0.3rem; flex-wrap: wrap; }
.mv-name { font-size: 0.82rem; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mv-inj  { font-family: var(--font-mono); font-size: 0.58rem; font-weight: 700; color: var(--danger); }
.mv-chips { display: flex; flex-wrap: wrap; gap: 0 0.55rem; margin-top: 0.1rem; }
.mv-chip  { font-family: var(--font-mono); font-size: 0.59rem; color: var(--text-muted); opacity: 0.9; white-space: nowrap; line-height: 1.4; }

/* Trend score */
.mv-score { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 600; min-width: 32px; text-align: right; flex-shrink: 0; padding-top: 0.25rem; }
.up   .mv-score { color: var(--success); }
.down .mv-score { color: var(--danger); }

/* Badges */
.mv-badge {
  display: inline-flex; align-items: center;
  font-size: 0.58rem; font-weight: 700; letter-spacing: 0.04em;
  padding: 0.1rem 0.35rem;
  border-radius: var(--radius-pill);
  flex-shrink: 0;
  white-space: nowrap;
}
.mv-badge.leading  { background: rgba(245,158,11,.15); color: var(--gold); }
.mv-badge.conf-hi  { background: rgba(16,185,129,.12); color: var(--success); }
.mv-badge.fa  { background: rgba(99,102,241,.15); color: #a5b4fc; }
.mv-badge.hot { background: rgba(239,68,68,.15); color: #fca5a5; }

/* Error / loading / empty */
.mv-empty { color: var(--text-muted); font-size: 0.78rem; text-align: center; padding: var(--space-5) 0; }

/* Waiver Targets section */
.waivers { margin-top: 0; margin-bottom: var(--space-4); background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-4); }
.waivers-hdr { color: var(--text-primary); }
.waivers-head { display:flex; align-items:center; justify-content:space-between; gap: var(--space-3); flex-wrap: wrap; }
.waivers-head .movers-col-hdr { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
.waivers #league-bar { margin-bottom: 0; }
.waivers #league-bar select { min-width: 160px; max-width: 100%; }
.waivers-sub { font-family: inherit; font-size: 0.72rem; color: var(--text-muted); margin: var(--space-2) 0 var(--space-3); padding-bottom: var(--space-2); border-bottom: 1px solid var(--border); }
.mv-more { display:block; width:100%; margin-top: var(--space-2); padding: 0.45rem; font-family: var(--font-mono); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; color: var(--text-secondary); background: none; border: 1px dashed var(--border); border-radius: var(--radius-sm); cursor: pointer; }
.mv-more:hover { border-color: var(--border-bright); color: var(--text-primary); }
.waivers .setup-card.gate { padding: var(--space-4); margin: 0; text-align: left; }
.waivers .setup-card.gate h2 { font-size: 0.95rem; margin-bottom: 0.3rem; }
.waivers .setup-card.gate p { font-size: 0.8rem; margin: 0 0 var(--space-3); max-width: none; }
.waivers .setup-card.gate .form-row { margin: 0; max-width: 380px; }
@media (max-width: 640px) {
  .waivers #league-bar { flex: 1 1 100%; }
  .waivers #league-bar select { flex: 1 1 auto; }
}
</style>
</head>
<body>

<nav id="rr-nav">
  <a href="/" class="rr-logo">Pocket</a>
  <div class="rr-links">
    <a href="/draft" class="rr-link">Draft</a>
    <a href="/research" class="rr-link">Research</a>
    <a href="/trade" class="rr-link">Trade</a>
    <a href="/lineup" class="rr-link">Lineup</a>
    <a href="/team" class="rr-link">Team</a>
    <a href="/trending" class="rr-link active">Movers</a>
  </div>
  <div class="rr-auth">
    <div id="user-btn-mount"></div>
    <button id="rr-sign-in" hidden>Sign In</button>
  </div>
  <button class="nav-hamburger" type="button" aria-label="Open menu" aria-controls="rr-nav" aria-expanded="false">&#9776;</button>
</nav>

<div id="app">
  <header class="page-head tool-head" id="tool-head">
    <div class="page-head-text">
      <h1 class="page-title" id="page-title">Movers</h1>
      <p class="page-sub" id="page-sub">Loading…</p>
    </div>
  </header>

  <div class="pos-filter" id="pos-filter">
    <button class="pos-pill active" data-pos="ALL">ALL</button>
    <button class="pos-pill QB" data-pos="QB">QB</button>
    <button class="pos-pill RB" data-pos="RB">RB</button>
    <button class="pos-pill WR" data-pos="WR">WR</button>
    <button class="pos-pill TE" data-pos="TE">TE</button>
  </div>

  <section id="waivers" class="waivers">
    <div class="waivers-head">
      <div class="movers-col-hdr waivers-hdr"><span>🎯 Waiver Targets</span></div>
      <div id="league-bar" hidden>
        <span>League:</span>
        <select id="league-sel"></select>
      </div>
    </div>
    <div class="waivers-sub" id="waivers-sub"></div>
    <div id="waivers-body"><div class="mv-empty">Loading…</div></div>
  </section>

  <div class="movers-grid">
    <div class="movers-col" id="col-up">
      <div class="movers-col-hdr up">↑ Trending Up</div>
      <div id="list-up"><div class="mv-empty">Loading…</div></div>
    </div>
    <div class="movers-col" id="col-down">
      <div class="movers-col-hdr down">↓ Trending Down</div>
      <div id="list-down"><div class="mv-empty">Loading…</div></div>
    </div>
  </div>
</div>

<script>window.__clerk_publishable_key = 'PUBLISHABLE_KEY_PLACEHOLDER';</script>
<script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js" crossorigin="anonymous"></script>
<script src="/shared/trending-score.js"></script>
<script>
var T = { data: null, activePos: 'ALL', clerk: null, me: null, waivers: null, league: null, waiversExpanded: false };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function headshot(id, name) {
  if (!id) return '';
  return '<img class="mv-hs" src="https://sleepercdn.com/content/nfl/players/thumb/' + esc(id) + '.jpg" ' +
    'alt="' + esc(name) + '" onerror="this.style.display=\'none\'">';
}

function rowHtml(m, direction, extraBadges) {
  var barPct = Math.round(Math.abs(m.trend) * 100);
  var inj = m.injury ? '<span class="mv-inj">' + esc(m.injury) + '</span>' : '';
  var badges = '';
  if (m.leading) badges += '<span class="mv-badge leading">⚡ Leading</span>';
  if (m.confidence === 'high') badges += '<span class="mv-badge conf-hi">Strong</span>';
  badges += (extraBadges || '');
  var chips = (m.why || []).slice(0, 3).map(function(w) {
    return '<span class="mv-chip">' + esc(w) + '</span>';
  }).join('');
  var scoreSign = direction === 'up' ? '+' : '';
  return '<div class="mv-row ' + direction + '">' +
    '<div class="mv-bar-wrap"><div class="mv-bar-bg"><div class="mv-bar-fill" style="width:' + barPct + '%"></div></div></div>' +
    headshot(m.id, m.name) +
    '<div class="mv-info">' +
      '<div class="mv-name-row">' +
        '<span class="mv-name">' + esc(m.name) + '</span>' +
        '<span class="pos-badge ' + esc(m.pos) + '">' + esc(m.pos) + ' ' + esc(m.team) + '</span>' +
        inj + badges +
      '</div>' +
      (chips ? '<div class="mv-chips">' + chips + '</div>' : '') +
    '</div>' +
    '<div class="mv-score">' + scoreSign + (m.trend * 100).toFixed(0) + '</div>' +
  '</div>';
}

function renderList(containerId, players, direction) {
  var el = document.getElementById(containerId);
  if (!el) return;
  if (!players || !players.length) {
    el.innerHTML = '<div class="mv-empty">No ' + (direction === 'up' ? 'trending-up' : 'trending-down') + ' players for this filter</div>';
    return;
  }
  el.innerHTML = players.map(function(m) { return rowHtml(m, direction, ''); }).join('');
}

function applyFilter() {
  if (!T.data) return;
  var pos = T.activePos;
  var up, down;
  if (pos === 'ALL') {
    up   = T.data.up;
    down = T.data.down;
  } else {
    up   = (T.data.up   || []).filter(function(m) { return m.pos === pos; });
    down = (T.data.down || []).filter(function(m) { return m.pos === pos; });
  }
  renderList('list-up',   up,   'up');
  renderList('list-down', down, 'down');
  if (T.waivers) renderWaivers();
}

document.getElementById('pos-filter').addEventListener('click', function(e) {
  var btn = e.target.closest('[data-pos]');
  if (!btn) return;
  T.activePos = btn.dataset.pos;
  T.waiversExpanded = false;
  document.querySelectorAll('.pos-pill').forEach(function(b) {
    b.classList.toggle('active', b.dataset.pos === T.activePos);
  });
  applyFilter();
});

async function boot() {
  var key = window.__clerk_publishable_key;
  if (key && key !== 'PUBLISHABLE_KEY_PLACEHOLDER' && window.Clerk) {
    try {
      var clerk = typeof window.Clerk.load === 'function' ? window.Clerk : new window.Clerk(key);
      await clerk.load({ telemetry: { disabled: true } });
      T.clerk = clerk;
      if (clerk.user) {
        var mount = document.getElementById('user-btn-mount');
        if (mount) clerk.mountUserButton(mount);
        T.me = await fetch('/api/me').then(function(r) { return r.ok ? r.json() : null; }).catch(function() { return null; });
      } else {
        var btn = document.getElementById('rr-sign-in');
        if (btn) {
          btn.hidden = false;
          btn.addEventListener('click', function() { clerk.openSignIn(); });
        }
      }
    } catch (e) {}
  } else {
    var section = document.getElementById('waivers');
    if (section) section.hidden = true;
  }

  try {
    var resp = await fetch('/api/trending?n=25');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    T.data = await resp.json();

    var week = T.data.lastCompleted || T.data.week;
    document.getElementById('page-title').textContent = 'Movers';
    document.getElementById('page-sub').textContent = 'After Week ' + week + ' — usage spikes, add/drop momentum, and form signals';

    applyFilter();
  } catch (err) {
    document.getElementById('list-up').innerHTML   = '<div class="mv-empty">Could not load trending data — try again</div>';
    document.getElementById('list-down').innerHTML = '<div class="mv-empty">Could not load trending data — try again</div>';
    document.getElementById('page-sub').textContent = 'Failed to load';
  }

  initWaivers();
}

function waiversGateHtml(eyebrow, heading, body, buttonId, buttonLabel) {
  return '<div class="setup-card gate">' +
    '<div class="gate-eyebrow">' + esc(eyebrow) + '</div>' +
    '<h2>' + esc(heading) + '</h2>' +
    '<p>' + esc(body) + '</p>' +
    '<button class="btn-primary" id="' + buttonId + '">' + esc(buttonLabel) + '</button>' +
  '</div>';
}

function showSignInGate() {
  var body = document.getElementById('waivers-body');
  body.innerHTML = waiversGateHtml(
    'Waiver Targets',
    'Sign in to see who\'s free in your leagues',
    'Connects to your Sleeper leagues and flags trending-up players nobody has rostered yet.',
    'waivers-auth-btn', 'Sign in'
  );
  document.getElementById('waivers-auth-btn').addEventListener('click', function() {
    if (T.clerk) T.clerk.openSignIn({ redirectUrl: '/trending' });
  });
}

function showConnectGate() {
  var body = document.getElementById('waivers-body');
  body.innerHTML = '<div class="setup-card gate">' +
    '<div class="gate-eyebrow">Waiver Targets</div>' +
    '<h2>Connect Your Sleeper Account</h2>' +
    '<p>Enter your Sleeper username to load your leagues and rosters.</p>' +
    '<div class="form-row">' +
      '<input id="waivers-sleeper-input" type="text" placeholder="Sleeper username" autocomplete="off">' +
      '<button class="btn-primary" id="waivers-sleeper-btn">Connect</button>' +
    '</div>' +
    '<div id="waivers-sleeper-err" class="error-msg" hidden></div>' +
  '</div>';
  document.getElementById('waivers-sleeper-btn').addEventListener('click', async function() {
    var btn = document.getElementById('waivers-sleeper-btn');
    var inp = document.getElementById('waivers-sleeper-input');
    var err = document.getElementById('waivers-sleeper-err');
    var u = inp.value.trim();
    if (!u) return;
    btn.disabled = true; btn.textContent = 'Connecting…'; err.hidden = true;
    try {
      var res = await fetch('/api/me/sleeper', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sleeperUsername: u }),
      });
      if (!res.ok) {
        var e = await res.json().catch(function() { return {}; });
        err.textContent = e.error || 'Sleeper user not found';
        err.hidden = false;
        return;
      }
      T.me = await res.json();
      await loadWaivers();
    } catch (e) {
      err.textContent = 'Network error — try again'; err.hidden = false;
    } finally {
      btn.disabled = false; btn.textContent = 'Connect';
    }
  });
}

function initWaivers() {
  var section = document.getElementById('waivers');
  if (!section || section.hidden) return;
  if (!T.clerk || !T.clerk.user) {
    showSignInGate();
  } else if (!T.me || !T.me.sleeperUserId) {
    showConnectGate();
  } else {
    loadWaivers();
  }
}

async function loadWaivers() {
  var body = document.getElementById('waivers-body');
  body.innerHTML = '<div class="mv-empty">Loading…</div>';
  try {
    var resp = await fetch('/api/me/waivers');
    if (!resp.ok) {
      var e = await resp.json().catch(function() { return {}; });
      if (resp.status === 404 && e.error === 'Sleeper account not linked') {
        showConnectGate();
        return;
      }
      throw new Error(e.error || ('HTTP ' + resp.status));
    }
    T.waivers = await resp.json();
    initLeaguePicker();
    renderWaivers();
  } catch (err) {
    body.innerHTML = '<div class="mv-empty">Couldn\'t load waiver targets — try again</div>';
  }
}

function initLeaguePicker() {
  var sel = document.getElementById('league-sel');
  var bar = document.getElementById('league-bar');
  if (!sel || !bar) return;
  sel.innerHTML = '';

  var failed = new Set((T.waivers.leaguesFailed || []).map(function(l) { return l.league_id; }));
  var loaded = (T.waivers.leagues || []).filter(function(l) { return !failed.has(l.league_id); });

  if (loaded.length <= 1) {
    bar.hidden = true;
    T.league = 'ALL';
    return;
  }

  loaded.forEach(function(l) {
    var opt = document.createElement('option');
    opt.value = l.league_id;
    opt.textContent = l.name || ('League ' + l.league_id);
    sel.appendChild(opt);
  });
  var allOpt = document.createElement('option');
  allOpt.value = 'ALL';
  allOpt.textContent = 'All leagues';
  sel.appendChild(allOpt);

  var primary = T.me && T.me.primaryLeagueId;
  var hasPrimary = primary && loaded.some(function(l) { return String(l.league_id) === String(primary); });
  var defaultLid = hasPrimary ? String(primary) : loaded[0].league_id;
  sel.value = defaultLid;
  T.league = defaultLid;
  bar.hidden = false;

  sel.onchange = function() {
    var lid = sel.value;
    T.league = lid;
    T.waiversExpanded = false;
    renderWaivers();
    if (lid !== 'ALL') {
      fetch('/api/me/leagues/' + encodeURIComponent(lid) + '/primary', { method: 'POST' })
        .then(function(res) { if (res.ok && T.me) T.me.primaryLeagueId = lid; })
        .catch(function() {});
    }
  };
}

function renderWaivers() {
  var body = document.getElementById('waivers-body');
  var sub = document.getElementById('waivers-sub');
  if (!T.waivers) return;

  var leagueNames = {};
  (T.waivers.leagues || []).forEach(function(l) { leagueNames[l.league_id] = l.name; });

  var totalLeagues = (T.waivers.leagues || []).length;
  var week = T.waivers.lastCompleted || T.waivers.week;
  var leagueName = (T.league && T.league !== 'ALL') ? (leagueNames[T.league] || T.league) : null;

  var subText = leagueName
    ? 'Free agents in ' + leagueName + ' · after Week ' + week
    : 'Free agents in your ' + totalLeagues + ' leagues · after Week ' + week;
  if (T.waivers.leaguesFailed && T.waivers.leaguesFailed.length) {
    subText += ' · couldn\'t load: ' + T.waivers.leaguesFailed.map(function(l) { return l.name; }).join(', ');
  }
  sub.textContent = subText;

  var pos = T.activePos;
  var targets = (T.waivers.targets || []).filter(function(m) {
    return (pos === 'ALL' || m.pos === pos) && (T.league === 'ALL' || m.faIn.indexOf(T.league) !== -1);
  });

  if (!targets.length) {
    var emptyMsg = leagueName
      ? (pos === 'ALL'
          ? 'No trending-up free agents in ' + esc(leagueName) + ' right now'
          : 'No trending-up ' + esc(pos) + ' free agents in ' + esc(leagueName))
      : (pos === 'ALL'
          ? 'No trending-up free agents in your leagues right now'
          : 'No trending-up ' + esc(pos) + ' free agents in your leagues');
    body.innerHTML = '<div class="mv-empty">' + emptyMsg + '</div>';
    return;
  }

  var showing = (!T.waiversExpanded && targets.length > 8) ? targets.slice(0, 8) : targets;
  var showMore = !T.waiversExpanded && targets.length > 8;
  var remaining = targets.length - 8;

  body.innerHTML = showing.map(function(m) {
    var extraBadges = '';
    if (T.league === 'ALL') {
      var title = m.faIn.map(function(lid) { return leagueNames[lid] || lid; }).join(', ');
      extraBadges += '<span class="mv-badge fa" title="' + esc(title) + '">FA in ' + m.faCount + '/' + totalLeagues + ' leagues</span>';
    }
    if (m.highDemand) extraBadges += '<span class="mv-badge hot">🔥 High demand</span>';
    return rowHtml(m, 'up', extraBadges);
  }).join('');

  if (showMore) {
    body.innerHTML += '<button class="mv-more" id="waivers-more">Show ' + remaining + ' more</button>';
    document.getElementById('waivers-more').addEventListener('click', function() {
      T.waiversExpanded = true;
      renderWaivers();
    });
  }
}
