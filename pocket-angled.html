<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #030306; padding: 48px; font-family: -apple-system, sans-serif; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 900px; }
.card { background: #09090f; border: 1px solid #0e0e18; border-radius: 20px; padding: 32px; text-align: center; }
.card img { width: 300px; height: 300px; object-fit: contain; border-radius: 16px; }
.label { font-size: 9px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #222232; margin-top: 16px; }
</style></head>
<body>
<div class="grid">
  <div class="card"><img src="ang_v1.png"><div class="label">Neon Border + Gloss</div></div>
  <div class="card"><img src="ang_v2.png"><div class="label">Holographic Foil</div></div>
  <div class="card"><img src="ang_v3.png"><div class="label">Glass Card — Glows From Inside</div></div>
  <div class="card"><img src="ang_v4.png"><div class="label">Brushed Metal — Purple QB Pop</div></div>
</div>
</body></html>
