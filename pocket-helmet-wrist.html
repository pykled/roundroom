<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #030306; padding: 48px; font-family: -apple-system, sans-serif; }
.section-label { font-size: 10px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: #4a4a6a; margin-bottom: 16px; }
.grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; max-width: 900px; margin-bottom: 48px; }
.card { background: #09090f; border: 1px solid #0e0e18; border-radius: 20px; padding: 32px; text-align: center; }
.card img { width: 200px; height: 200px; object-fit: contain; border-radius: 16px; }
.label { font-size: 9px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #222232; margin-top: 16px; }
</style></head>
<body>
<div class="section-label">Helmet</div>
<div class="grid">
  <div class="card"><img src="helm_v1.png"><div class="label">Flat Silhouette</div></div>
  <div class="card"><img src="helm_v2.png"><div class="label">Chrome + Purple Visor</div></div>
  <div class="card"><img src="helm_v3.png"><div class="label">Neon Outline</div></div>
</div>
<div class="section-label">Play-Call Wristband</div>
<div class="grid">
  <div class="card"><img src="wrist_v1.png"><div class="label">Dark Card + Glow Edge</div></div>
  <div class="card"><img src="wrist_v2.png"><div class="label">Formation Diagram</div></div>
  <div class="card"><img src="wrist_v3.png"><div class="label">Badge + QB Dot</div></div>
</div>
</body></html>
