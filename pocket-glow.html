<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #030306; padding: 48px; font-family: -apple-system, sans-serif; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 900px; }
.card { background: #09090f; border: 1px solid #0e0e18; border-radius: 20px; padding: 32px; text-align: center; }
.card img { width: 200px; height: 200px; object-fit: contain; border-radius: 16px; }
.label { font-size: 9px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #222232; margin-top: 16px; }
</style></head>
<body>
<div class="grid">
  <div class="card"><img src="glow_v1.png"><div class="label">Glow V1 — Double Arc, Neon Bloom</div></div>
  <div class="card"><img src="glow_v2.png"><div class="label">Glow V2 — Neon Tube Arc</div></div>
  <div class="card"><img src="glow_v3.png"><div class="label">Glow V3 — White-to-Purple Gradient</div></div>
  <div class="card"><img src="glow_v4.png"><div class="label">Glow V4 — Atmospheric Glow</div></div>
</div>
</body></html>
