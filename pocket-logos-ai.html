<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #07070d; padding: 48px; font-family: -apple-system, sans-serif; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 900px; }
.card { background: #0d0d15; border: 1px solid #111118; border-radius: 20px; padding: 32px; text-align: center; }
.card img { width: 200px; height: 200px; object-fit: contain; border-radius: 12px; }
.label { font-size: 9px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #2a2a3a; margin-top: 16px; }
</style></head>
<body>
<div class="grid">
  <div class="card"><img src="logo_formation.png"><div class="label">Formation Dots</div></div>
  <div class="card"><img src="logo_shield.png"><div class="label">Shield Mark</div></div>
  <div class="card"><img src="logo_arc.png"><div class="label">Pocket Arc</div></div>
  <div class="card"><img src="logo_radar.png"><div class="label">Radar Arcs</div></div>
</div>
</body></html>
