name: Update Draft Data
on:
  schedule:
    - cron: '0 7 * * *'   # 7am UTC = midnight Pacific
    - cron: '0 19 * * *'  # 7pm UTC = noon Pacific — extra draft-season run to catch afternoon drafts
  workflow_dispatch:  # allow manual trigger
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 75min crawl + post-processing headroom
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # No package-lock.json in this repo, so key on package.json and skip
      # install entirely on an exact cache hit.
      - uses: actions/cache@v4
        id: node-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}
      - if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm install
      # Restore persisted frontier + known leagues from the previous run so we
      # skip re-exploring users/leagues already traversed. The crawl saves these
      # back to data/ at completion and they're committed alongside the picks.
      - run: node scripts/crawl.js --resume
      - run: node scripts/aggregate.js
      - name: Aggregate SF ADP
        run: node scripts/aggregate.js --sf
      - name: Verify crawl quality
        # Fail the run rather than committing empty/thin data — a red run is
        # visible; a silent commit of bad data is not.
        run: |
          node -e '
            const q = require("./data/data_quality.json");
            const n = q.drafts_after_quality_filter || 0;
            console.log(`Quality drafts this run: ${n}`);
            if (n < 5) {
              console.error(`FAIL: only ${n} quality drafts (<5). Refusing to publish stale/thin data.`);
              process.exit(1);
            }
          '
      - run: node scripts/vorp.js
      - run: node scripts/fetch-fantasypros.js
      - run: node scripts/fetch-underdog.js
      - name: Fetch FantasyPros SF ADP
        run: node scripts/fetch-fantasypros-sf-adp.js
      - run: node scripts/fetch-injuries.js
      - run: node scripts/merge-sources.js
      - name: Commit data
        run: |
          git config user.name "RoundRoom Bot"
          git config user.email "bot@roundroom.app"
          git add data/
          git diff --staged --quiet || git commit -m "chore: update draft data $(date -u +%Y-%m-%d)"
          git push
